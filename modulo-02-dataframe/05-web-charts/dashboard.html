<!DOCTYPE html><html><head><meta charset="UTF-8"/><title>Kof Web Dashboard</title><style>body{font-family:sans-serif;margin:24px} .grid{display:grid;grid-template-columns:1fr 1fr;gap:24px} canvas{border:1px solid #ccc}</style></head><body>
<h1>Iris & Transactions Dashboard (Kof Web)</h1>
<div class="grid"><div><h2>Scatter (SVG server-side)</h2><svg xmlns="http://www.w3.org/2000/svg" width="500" height="350"><rect width="100%" height="100%" fill="white"/><line x1="40.0" y1="310.0" x2="460.0" y2="310.0" stroke="black"/><line x1="40.0" y1="40.0" x2="40.0" y2="310.0" stroke="black"/><circle cx="124.0" cy="304.25531914893617" r="5" fill="#e41a1c" opacity="0.8"/><circle cx="90.40000000000012" cy="304.25531914893617" r="5" fill="#e41a1c" opacity="0.8"/><circle cx="56.80000000000009" cy="310.0" r="5" fill="#e41a1c" opacity="0.8"/><circle cx="40.0" cy="298.51063829787233" r="5" fill="#e41a1c" opacity="0.8"/><circle cx="107.20000000000006" cy="304.25531914893617" r="5" fill="#e41a1c" opacity="0.8"/><circle cx="443.2000000000001" cy="114.68085106382978" r="5" fill="#377eb8" opacity="0.8"/><circle cx="342.40000000000015" cy="126.17021276595744" r="5" fill="#377eb8" opacity="0.8"/><circle cx="426.4000000000001" cy="103.19148936170211" r="5" fill="#377eb8" opacity="0.8"/><circle cx="191.20000000000007" cy="154.89361702127658" r="5" fill="#377eb8" opacity="0.8"/><circle cx="359.20000000000005" cy="120.42553191489364" r="5" fill="#377eb8" opacity="0.8"/><circle cx="325.6" cy="40.0" r="5" fill="#4daf4a" opacity="0.8"/><circle cx="241.60000000000005" cy="91.70212765957447" r="5" fill="#4daf4a" opacity="0.8"/><circle cx="460.0" cy="45.74468085106383" r="5" fill="#4daf4a" opacity="0.8"/><circle cx="325.6" cy="62.97872340425536" r="5" fill="#4daf4a" opacity="0.8"/><circle cx="359.20000000000005" cy="51.48936170212767" r="5" fill="#4daf4a" opacity="0.8"/></svg></div><div><h2>Bars (SVG server-side)</h2><svg xmlns="http://www.w3.org/2000/svg" width="400" height="280"><rect width="100%" height="100%" fill="white"/><rect x="61.333333333333336" y="40.0" width="64.0" height="200.0" fill="#377eb8"/><text x="93.33333333333334" y="260.0" text-anchor="middle" font-size="11">SP</text><rect x="168.00000000000003" y="140.0" width="64.0" height="100.0" fill="#377eb8"/><text x="200.00000000000003" y="260.0" text-anchor="middle" font-size="11">RJ</text><rect x="274.6666666666667" y="190.0" width="64.0" height="50.0" fill="#377eb8"/><text x="306.6666666666667" y="260.0" text-anchor="middle" font-size="11">MG</text></svg></div></div>
<h2>Bars (Canvas KofJS client-side)</h2><canvas id="chart" width="400" height="280"></canvas>
<script>var data=[{city:"SP",total:4.0},{city:"RJ",total:2.0},{city:"MG",total:1.0}; var c=document.getElementById('chart'); var ctx=c.getContext('2d'); var maxV=0; for(var i=0;i<data.length;i++){ if(data[i].total>maxV) maxV=data[i].total; } var pad=40; var w=c.width, h=c.height; var slot=(w-2*pad)/data.length; var barW=slot*0.6; ctx.strokeStyle='#000'; ctx.beginPath(); ctx.moveTo(pad,h-pad); ctx.lineTo(w-pad,h-pad); ctx.stroke(); for(var i=0;i<data.length;i++){ var bh=(data[i].total/maxV)*(h-2*pad); var x=pad+i*slot+slot*0.2; var y=h-pad-bh; ctx.fillStyle='#377eb8'; ctx.fillRect(x,y,barW,bh); ctx.fillStyle='#000'; ctx.font='11px sans-serif'; ctx.fillText(data[i].city, x+barW/2-10, h-15); }</script>
<p>Serve com: <code>kof serve modulo-02-dataframe/05-web-charts/</code> ou <code>kof run</code> + <code>kof build --target js</code></p>
</body></html>
